<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Korean Flashcards - Reading Practice</title>
    <link rel="stylesheet" href="Skills.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>🇰🇷 Korean Flashcard Reader</h1>
            <p>Click a category, then click the card to reveal the answer</p>
            <button id="dark-mode-toggle">🌙 Dark Mode</button>
        </header>

        <footer class="site-footer">
        Developed by
        <a href="https://www.facebook.com/charles.dimalanta.33" target="_blank" rel="noopener noreferrer">Charles Dimalanta</a>
        </footer>

        <!-- Category Selection -->
        <div id="category-container">
            <h2>Choose a Category:</h2>
            <input type="text" id="category-search" placeholder="🔍 Search categories..." autocomplete="off">
            <div class="mode-controls">
                <button id="multi-select-toggle" class="mode-toggle">📚 Multi-Select Mode</button>
                <button id="select-all-btn" class="hidden">✓ Select All</button>
                <button id="start-multi-btn" class="hidden primary-btn">Start Selected Categories →</button>
            </div>
            <div id="category-buttons">
                <!-- Buttons will be generated by JavaScript -->
            </div>
        </div>

        <!-- Flashcard Display Area -->
        <div id="flashcard-area" class="hidden">
            <div id="current-category-display"></div>
            <div id="flashcard" class="flashcard">
                <div class="card-content">
                    <!-- Content will be filled by JavaScript -->
                </div>
            </div>

            <!-- Navigation Buttons -->
            <div class="navigation">
                <button id="prev-btn">← Previous</button>
                <span id="card-counter">1 / 10</span>
                <button id="next-btn">Next →</button>
            </div>
            <button id="shuffle-btn">🔀 Shuffle</button>
            <button id="autoplay-btn">▶ Auto Play</button>
            <button id="back-to-categories">← Back to Categories</button>
        </div>

        <!-- Hard Words Section -->
        <div id="hard-words-section" class="hidden" style="margin-top: 40px;">
            <div id="hard-words-container">
                <h2>🔴 Hard Words</h2>
                <p class="hard-words-subtitle">Words you've marked as hard. Copy the JS below to paste into your content file.</p>
                <div id="hard-words-list"></div>
                <div class="hard-words-actions">
                    <button id="copy-hard-words-btn" class="primary-btn">📋 Copy JS</button>
                    <button id="clear-hard-words-btn" class="clear-btn">🗑 Clear All</button>
                </div>
                <pre id="hard-words-code" class="hard-words-code"></pre>
            </div>
        </div>

    </div>

    <script src="Skills.js"></script>
    <script src="SkillsTest.js"></script>
</body>
</html>
